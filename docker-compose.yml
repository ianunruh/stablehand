services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stablehand
      POSTGRES_PASSWORD: stablehand
      POSTGRES_DB: stablehand
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stablehand"]
      interval: 2s
      timeout: 5s
      retries: 20

  web:
    build: .
    command: sh -c "alembic upgrade head && stablehand-web"
    environment: &app
      STABLEHAND_DATABASE_URL: postgresql+psycopg://stablehand:stablehand@postgres:5432/stablehand
      STABLEHAND_SECRET_KEY: dev-compose-secret
      STABLEHAND_PUBLIC_URL: http://localhost:8000
      STABLEHAND_RUNNER_API_URL: http://web:8000
      STABLEHAND_ADMIN_EMAIL: admin@example.com
      STABLEHAND_ADMIN_PASSWORD: changeme
      STABLEHAND_SEED_DEMO: "true"
      STABLEHAND_DEMO_PATH: /app/examples/demo
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: stablehand-worker
    environment: *app
    depends_on:
      web:
        condition: service_healthy
