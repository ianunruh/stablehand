[project]
name = "stablehand"
version = "0.1.0"
description = "Check, approve, and apply pyinfra runs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "authlib>=1.4",
    "croniter>=6.0",
    "cryptography>=44.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "kubernetes>=32.0",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pyinfra>=3.7",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
stablehand-web = "stablehand.web:main"
stablehand-worker = "stablehand.worker:main"
stablehand-runner = "stablehand.runner.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stablehand"]
# Compiled stylesheet is gitignored; the image and dev command produce it before install.
artifacts = ["src/stablehand/static/app.css"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = ["postgres: requires a PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 duplicates the formatter, which owns line length.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
